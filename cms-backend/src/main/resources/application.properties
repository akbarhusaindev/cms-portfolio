spring.application.name=cms-backend

# ===============================
# Database Configuration (Neon PostgreSQL)
# Supports SPRING_DATASOURCE_* or DATABASE_* environment variables
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/cms_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# File Upload Configuration
# ===============================
file.upload-dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Cloudinary Configuration
# Pass via environment variables: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# JWT Configuration
# Pass JWT_SECRET via environment variable in production (minimum 32 characters)
# ===============================
jwt.secret=${JWT_SECRET:your_default_jwt_secret_key_change_in_production_32bytes_minimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Admin Credentials (configured securely via environment variables)
# ===============================
admin.default.username=${ADMIN_USERNAME:}
admin.default.password=${ADMIN_PASSWORD:}